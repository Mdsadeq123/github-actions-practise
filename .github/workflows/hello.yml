#workflow
name: Hello
#on tells when the workflow should run
on:
  workflow_dispatch:
#Jobs
#what the workflow should do
#should be inside the workflow
jobs:
  #1st job 
  say-hello:
      #creates an ephermal container with ubuntu running 
     runs-on: ubuntu-latest
     # that ephermal conatiner will have the steps to execute , hence name those steps and use run:
     steps:
       - name: Say hello to everyone
         run: echo "hello dosto"
#steps
#should be inside the job

#actions
#should be inside the steps
